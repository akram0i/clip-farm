name: Validate repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Check structure and secrets
        run: python scripts/validate_structure.py
      - name: Compile Python
        run: python -m compileall -q pipeline scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and test dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm test
          npm run build
